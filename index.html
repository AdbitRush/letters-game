<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>ממלכת האותיות והממתקים</title>

    <!-- פונטים מ-Google Fonts: Heebo/Rubik לממשק, השאר לבחירת "צורת האות" -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&family=Comic+Neue:wght@700&family=Fredoka:wght@600;700&family=Heebo:wght@400;500;600;700;800&family=Rubik:wght@500;600;700;800&family=Sniglet:wght@800&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink: #24324A;
            --ink-muted: #64748B;
            --cream: #FFF9F0;
            --surface: #FFFFFF;
            --sky: #DDF3FF;
            --blue: #4B8FEA;
            --blue-dark: #2F6FCC;
            --purple: #7758C8;
            --pink: #F47EAC;
            --yellow: #FFD65A;
            --mint: #7EDDB5;
            --mint-dark: #2F9B72;
            --coral: #FF7A73;
            --border: #D8E2EE;
            --shadow: rgba(36,50,74,.16);
            --overlay: rgba(27,38,59,.38);
            --ui-font: 'Heebo', Arial, sans-serif;
            --title-font: 'Rubik', 'Heebo', sans-serif;
            --game-font: 'Fredoka', sans-serif;
            --radius-sm: 12px;
            --radius-md: 18px;
            --radius-lg: 28px;
            --shadow-sm: 0 4px 12px rgba(36,50,74,.10);
            --shadow-md: 0 14px 40px rgba(36,50,74,.18);
        }
        * { box-sizing: border-box; -webkit-user-select: none; user-select: none; margin: 0; padding: 0; }
        button, input, select { font: inherit; }
        body {
            background: var(--sky); font-family: var(--ui-font); color: var(--ink);
            text-align: center; overflow-x: clip; width: 100%; min-height: 100dvh; height: 100dvh; position: relative;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important;
            }
        }

        /* ── מסך פתיחה ── */
        #start-screen {
            position: absolute; inset: 0;
            background: linear-gradient(180deg, rgba(255,255,255,.20), rgba(40,52,80,.20)), url('bg.jpg') center/cover no-repeat, linear-gradient(180deg, var(--sky), #F8E9F3);
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 50;
            overflow-y: auto; padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
        }
        .start-card {
            width: min(560px, calc(100% - 32px)); padding: 32px; border-radius: var(--radius-lg);
            background: rgba(255,249,240,.94); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,.75); box-shadow: var(--shadow-md);
            display: flex; flex-direction: column; align-items: stretch; gap: 20px; margin: auto 0;
            animation: cardIn .35s cubic-bezier(.2,.9,.3,1.1);
        }
        @keyframes cardIn { from { opacity:0; transform: translateY(10px) scale(.98);} to {opacity:1; transform:none;} }

        .start-header { display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .start-icon { font-size: 56px; line-height: 1; }
        #start-screen h1 {
            font-family: var(--title-font); font-weight: 800; color: var(--ink);
            font-size: clamp(30px, 4vw, 44px); line-height: 1.05;
        }
        .start-sub { font-size: 16px; color: var(--ink-muted); font-weight: 500; }

        .field-label { display: block; font-family: var(--ui-font); font-weight: 700; font-size: 16px; color: var(--ink); text-align: right; margin-bottom: 8px; }

        /* מצב משחק — segmented control */
        .mode-selection {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
            background: #EDF3F8; padding: 6px; border-radius: 16px;
        }
        .mode-btn {
            background: transparent; color: #526176; border: 0; min-height: 48px; padding: 8px 6px;
            font-family: var(--ui-font); font-weight: 700; font-size: 15px; border-radius: 14px; cursor: pointer;
            transition: background .18s ease, color .18s ease, box-shadow .18s ease;
        }
        .mode-btn:hover { background: rgba(255,255,255,.6); }
        .mode-btn.active { background: #FFFFFF; color: var(--blue-dark); box-shadow: 0 3px 10px rgba(36,50,74,.12); }
        .mode-btn:focus-visible { outline: 3px solid rgba(75,143,234,.45); outline-offset: 2px; }

        #name-input-container { display: flex; flex-direction: column; }
        #name-input {
            height: 56px; width: 100%; max-width: none; padding: 0 18px; font-size: 22px; text-align: center;
            border-radius: 16px; border: 2px solid var(--border); outline: none;
            text-transform: uppercase; color: var(--ink); font-weight: 700; background: var(--surface);
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        #name-input::placeholder { color: #A9B6C6; font-weight: 500; text-transform: none; }
        #name-input:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(75,143,234,.15); }
        .field-error { font-size: 14px; color: #C2413A; margin-top: 6px; text-align: right; }
        .field-error.hidden { display: none; }

        /* כפתור ראשי */
        .action-btn {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            min-height: 56px; width: 100%; border: 0; border-radius: 18px; padding: 14px 28px;
            font-family: var(--ui-font); font-weight: 700; font-size: 18px; color: #fff; cursor: pointer;
            background: linear-gradient(180deg, #579CF0 0%, #3D7ED9 100%);
            box-shadow: 0 8px 0 var(--blue-dark), 0 12px 22px rgba(47,111,204,.24);
            transition: transform .15s ease, box-shadow .15s ease, filter .15s ease, opacity .15s ease;
        }
        .action-btn .btn-icon { width: 18px; height: 18px; flex: 0 0 auto; }
        .action-btn:hover { filter: brightness(1.05); transform: translateY(-1px); }
        .action-btn:active { transform: translateY(5px); box-shadow: 0 3px 0 var(--blue-dark); }
        .action-btn:focus-visible { outline: 4px solid rgba(75,143,234,.30); outline-offset: 3px; }
        .action-btn.is-empty { opacity: .55; box-shadow: 0 4px 0 var(--blue-dark), 0 6px 14px rgba(47,111,204,.18); }

        #best-score {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            font-size: 15px; font-weight: 600; color: var(--ink-muted);
        }
        #best-score .score-icon { color: var(--yellow); flex: 0 0 auto; }
        #best-score .num { color: var(--ink); font-weight: 700; }

        /* הגדרות מתקפלות */
        .settings { border-top: 1px solid var(--border); padding-top: 12px; text-align: right; }
        .settings summary {
            display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;
            list-style: none; font-size: 14px; font-weight: 600; color: var(--ink-muted);
        }
        .settings summary::-webkit-details-marker { display: none; }
        .settings summary:focus-visible { outline: 3px solid rgba(75,143,234,.45); outline-offset: 3px; border-radius: 8px; }
        .settings-body { margin-top: 14px; }
        .font-select {
            width: 100%; height: 48px; padding: 0 14px; font-size: 16px; border-radius: 12px;
            border: 1px solid var(--border); outline: none; background: var(--surface); color: var(--ink);
            font-weight: 600; cursor: pointer; box-shadow: none;
        }
        .font-select:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(75,143,234,.15); }

        /* ── סרגל המשחק ── */
        #ui-bar {
            position: absolute; top: max(0px, env(safe-area-inset-top)); left: 0; width: 100%; height: 76px;
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
            background: rgba(255,255,255,.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(216,226,238,.9); box-shadow: 0 5px 18px rgba(36,50,74,.10);
            padding-inline: 20px; color: var(--ink); z-index: 10;
            max-width: 1100px; margin-inline: auto; inset-inline: 0;
        }
        .hud-group { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
        .hud-center { flex: 1; justify-content: center; min-width: 0; }

        #letter-display {
            display: flex; align-items: center; justify-content: center;
            width: 44px; height: 44px; border-radius: 14px; flex: 0 0 auto;
            background: var(--purple); color: #fff; font-family: var(--game-font);
            font-size: 22px; font-weight: 700;
        }
        .hud-label { font-size: 13px; font-weight: 600; color: var(--ink-muted); white-space: nowrap; }

        .progress-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .progress-bar { width: 140px; height: 8px; border-radius: 99px; background: #E7EEF5; overflow: hidden; flex: 0 0 auto; }
        .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--yellow), #FFC233); border-radius: 99px; transition: width .3s ease; }
        #stars-display, #total-stars { font-weight: 700; }
        .progress-count { font-size: 14px; font-weight: 600; white-space: nowrap; }
        .progress-count .num { transition: transform .2s ease; display: inline-block; }
        .progress-count.pop .num { animation: countPop .26s ease; }
        @keyframes countPop { 0% { transform: scale(1); } 50% { transform: scale(1.35); } 100% { transform: scale(1); } }

        .lives-row { display: flex; gap: 4px; }
        .life-icon { width: 18px; height: 18px; color: var(--coral); transition: transform .2s ease, opacity .2s ease; }
        .life-icon.lost { color: var(--border); opacity: .6; transform: scale(.85); }

        .icon-btn {
            width: 44px; height: 44px; flex: 0 0 44px; border-radius: 14px; border: 1px solid var(--border);
            background: #F2F6FA; color: #526176; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: background .15s ease, transform .15s ease;
        }
        .icon-btn:hover { background: #E5EEF7; }
        .icon-btn:active { transform: scale(.94); }
        .icon-btn:focus-visible { outline: 3px solid rgba(75,143,234,.45); outline-offset: 2px; }
        .icon-btn svg { width: 20px; height: 20px; }

        #gameCanvas {
            position: absolute; top: 76px; left: 0; width: 100%; height: calc(100% - 76px);
            display: block; touch-action: pinch-zoom; background: var(--sky);
            opacity: 0; animation: canvasIn .25s ease forwards;
        }
        @keyframes canvasIn { to { opacity: 1; } }

        .hint-chip {
            position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
            background: rgba(36,50,74,.85); color: #fff; font-size: 14px; font-weight: 600;
            padding: 10px 18px; border-radius: 99px; box-shadow: var(--shadow-sm); z-index: 11;
            transition: opacity .3s ease, visibility .3s ease; pointer-events: none;
        }
        .hint-chip.hidden { opacity: 0; visibility: hidden; }

        /* ── מודל הצלחה ומסך ניצחון ── */
        #modal, #victory-screen {
            position: absolute; inset: 0; background: var(--overlay);
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 20;
            padding: 20px;
        }
        #victory-screen { z-index: 30; }
        #modal.hidden, #victory-screen.hidden { display: none !important; }

        .dialog-card {
            width: min(480px, calc(100% - 16px)); max-height: calc(100dvh - 40px); overflow-y: auto;
            background: var(--surface); border-radius: var(--radius-lg); padding: 28px;
            box-shadow: var(--shadow-md); display: flex; flex-direction: column; align-items: center; gap: 14px;
            animation: cardPop .45s cubic-bezier(.2,.9,.3,1.2);
        }
        @keyframes cardPop { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: scale(1); } }

        .success-icon { width: 52px; height: 52px; color: var(--mint-dark); }
        #modal-title { font-family: var(--title-font); font-weight: 800; font-size: 24px; color: var(--ink); }
        #modal-text { font-size: 16px; color: var(--ink-muted); font-weight: 500; }

        #characters-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 6px 0; }
        .char-card {
            border: 2px solid transparent; background: #F6F9FC; border-radius: 15px;
            padding: 10px 14px; font-size: 32px; cursor: pointer; transition: transform .15s ease, background .15s ease, border-color .15s ease;
        }
        .char-card.selected { border-color: var(--blue); background: #EAF3FF; transform: scale(1.04); }

        .victory-title { font-family: var(--title-font); font-weight: 800; font-size: 22px; color: var(--ink); }
        .victory-name {
            font-family: var(--title-font); font-size: 44px; font-weight: 800; color: var(--purple);
            letter-spacing: 2px; margin: 4px 0;
        }
        .dancing-chars { font-size: 38px; display: flex; gap: 10px; }
        .dancing-chars span { display: inline-block; animation: charPop .5s cubic-bezier(.2,.9,.3,1.2) both; }
        .dancing-chars span:nth-child(2) { animation-delay: .08s; }
        .dancing-chars span:nth-child(3) { animation-delay: .16s; }
        @keyframes charPop { from { opacity: 0; transform: translateY(10px) scale(.7); } to { opacity: 1; transform: none; } }
    </style>
</head>
<body>
    <div id="start-screen">
        <div class="start-card">
            <div class="start-header">
                <div class="start-icon" aria-hidden="true">🦄</div>
                <h1>ממלכת האותיות</h1>
                <p class="start-sub">לומדים לכתוב אותיות בדרך מתוקה</p>
            </div>

            <div class="mode-selection" role="group" aria-label="בחירת מצב משחק">
                <button id="mode-name-btn" class="mode-btn active" aria-pressed="true">לפי שם</button>
                <button id="mode-all-btn" class="mode-btn" aria-pressed="false">כל ה-ABC</button>
                <button id="mode-numbers-btn" class="mode-btn" aria-pressed="false">מספרים 0-9</button>
            </div>

            <div id="name-input-container">
                <label for="name-input" class="field-label">מה השם שלך באנגלית?</label>
                <input type="text" id="name-input" placeholder="למשל NETA" maxlength="8" autocomplete="off">
                <p id="name-hint" class="field-error hidden">אם תשאירו ריק נשחק עם השם NETA</p>
            </div>

            <button id="start-btn" class="action-btn">
                <span>מתחילים לשחק</span>
                <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
            </button>

            <div id="best-score">
                <svg class="score-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v3a5 5 0 0 1-5 5 5 5 0 0 1-5-5V4Z"/><path d="M7 5H4a3 3 0 0 0 3 5M17 5h3a3 3 0 0 1-3 5"/><path d="M12 12v3m-3 3h6m-5 0 .5-3h3l.5 3"/></svg>
                <span>השיא שלי: <span class="num" id="best-score-value">0</span> ממתקים</span>
            </div>

            <details class="settings">
                <summary>
                    <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.03.03a2 2 0 1 1-2.83 2.83l-.03-.03a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.05a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.03.03a2 2 0 1 1-2.83-2.83l.03-.03a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.05a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.03-.03a2 2 0 1 1 2.83-2.83l.03.03a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.05a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.03-.03a2 2 0 1 1 2.83 2.83l-.03.03a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.05a1.65 1.65 0 0 0-1.51 1Z"/></svg>
                    <span>הגדרות</span>
                </summary>
                <div class="settings-body">
                    <label for="font-select" class="field-label">צורת האות</label>
                    <select id="font-select" class="font-select">
                        <option value="'Fredoka', sans-serif" selected>Fredoka (עגול ומודרני)</option>
                        <option value="'Bubblegum Sans', cursive">Bubblegum (מתוק ושובב)</option>
                        <option value="'Sniglet', cursive">Sniglet (בועות רכות)</option>
                        <option value="'Comic Neue', cursive">Comic Neue (ברור וקלאסי)</option>
                    </select>
                </div>
            </details>
        </div>
    </div>

    <div id="ui-bar">
        <div class="hud-group">
            <div id="letter-display">A</div>
        </div>

        <div class="hud-group hud-center">
            <div class="progress-wrap">
                <span class="hud-label">ממתקים</span>
                <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
                <span class="progress-count" id="progress-count"><span class="num" id="stars-display">0</span>/<span id="total-stars">0</span></span>
            </div>
        </div>

        <div class="hud-group">
            <div class="lives-row" id="lives-display" aria-live="polite" aria-label="חיים שנותרו"></div>
            <button id="music-btn" class="icon-btn" title="הפעל/השתק מוזיקה" aria-pressed="true"></button>
            <button id="home-btn" class="icon-btn" title="חזרה להתחלה"></button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>
    <div class="hint-chip hidden" id="hint-chip"></div>

    <div id="modal" class="hidden">
        <div class="dialog-card">
            <svg class="success-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.2"/><path d="m8 12.5 2.8 2.8L16.5 9"/></svg>
            <h2 id="modal-title">כל הכבוד!</h2>
            <p id="modal-text">כתבת את האות בהצלחה!</p>
            <div id="character-selection">
                <div id="characters-list"></div>
            </div>
            <button id="next-level-btn" class="action-btn">
                <span>המשך לאות הבאה</span>
                <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
            </button>
        </div>
    </div>

    <div id="victory-screen" class="hidden">
        <div class="dialog-card">
            <div class="victory-title">אלופים! סיימתם את המשחק!</div>
            <div id="victory-name-display" class="victory-name">NETA</div>
            <div class="dancing-chars">
                <span>🧜‍♀️</span><span>🦄</span><span>🐱</span>
            </div>
            <button id="replay-btn" class="action-btn">
                <span>לשחק שוב</span>
                <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
            </button>
        </div>
    </div>

    <!-- מוזיקת רקע נעימה -->
    <audio id="bg-music" loop preload="auto">
        <source src="https://directory.audio/media/songs_lo/free-music-happy-days.mp3" type="audio/mpeg">
    </audio>

    <script>
    (function() {
        const ICON_HOME = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1H9.5a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-9"/></svg>';
        const ICON_SOUND_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
        const ICON_SOUND_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16 9l5 6M21 9l-5 6"/></svg>';
        const ICON_HEART_FULL = '<svg viewBox="0 0 24 24" class="life-icon"><path d="M12 21s-7.5-4.6-10-9.1C.3 8.4 2 4.8 5.6 4.2 8 3.8 10 5 12 7.4 14 5 16 3.8 18.4 4.2 22 4.8 23.7 8.4 22 11.9 19.5 16.4 12 21 12 21Z" fill="currentColor"/></svg>';
        const ICON_HEART_LOST = '<svg viewBox="0 0 24 24" class="life-icon lost"><path d="M12 21s-7.5-4.6-10-9.1C.3 8.4 2 4.8 5.6 4.2 8 3.8 10 5 12 7.4 14 5 16 3.8 18.4 4.2 22 4.8 23.7 8.4 22 11.9 19.5 16.4 12 21 12 21Z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';

        const AVAILABLE_CHARACTERS = [
            { id: 'mermaid', emoji: '🧜‍♀️' }, { id: 'unicorn', emoji: '🦄' },
            { id: 'cat', emoji: '🐱' }, { id: 'bunny', emoji: '🐰' }, { id: 'dog', emoji: '🐶' },
            { id: 'panda', emoji: '🐼' }, { id: 'penguin', emoji: '🐧' }, { id: 'butterfly', emoji: '🦋' }
        ];

        const SWEETS = ['🍬', '🍭', '🍩', '🍦'];

        const ALPHABET = {

        const NUMBERS = {

        };

        const SHAPES = Object.assign({}, ALPHABET, NUMBERS);

        const STATS_KEY = 'lettersGameStats';
        function loadStats() {
            try {
                const raw = JSON.parse(localStorage.getItem(STATS_KEY));
                if (raw && typeof raw === 'object') {
                    return { bestStars: raw.bestStars || 0, unlockedChars: Array.isArray(raw.unlockedChars) ? raw.unlockedChars : [AVAILABLE_CHARACTERS[0].id] };
                }
            } catch (e) {}
            return { bestStars: 0, unlockedChars: [AVAILABLE_CHARACTERS[0].id] };
        }
        function saveStats(stats) {
            try { localStorage.setItem(STATS_KEY, JSON.stringify(stats)); } catch (e) {}
        }

        let audioCtx = null;
        function playTone(freq, duration, type) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type || 'sine';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }
        function playCollectSound() { playTone(880, 0.15, 'triangle'); }
        function playChestSound() {
            [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => playTone(f, 0.25, 'triangle'), i * 90));
        }
        function playVictorySound() {
            [523, 587, 659, 784, 880, 1047].forEach((f, i) => setTimeout(() => playTone(f, 0.3, 'square'), i * 120));
        }
        function hapticTick() {
            try { if (navigator.vibrate) navigator.vibrate(25); } catch (e) {}
        }

        // צבעי המערכת — לא הפלטה הישנה של מג'נטה/ציאן
        const THEME_COLORS = ['#4B8FEA', '#7758C8', '#F47EAC', '#FFD65A', '#7EDDB5'];

        class Confetti {
            constructor(w, h) {
                this.x = Math.random() * w;
                this.y = Math.random() * h - h;
                this.size = 8 + Math.random() * 10;
                this.speedY = 2 + Math.random() * 4;
                this.speedX = (Math.random() - 0.5) * 2;
                this.color = THEME_COLORS[Math.floor(Math.random() * THEME_COLORS.length)];
                this.rotation = Math.random() * 360;
                this.rotSpeed = (Math.random() - 0.5) * 10;
            }
            update(h) {
                this.y += this.speedY; this.x += this.speedX; this.rotation += this.rotSpeed;
                if (this.y > h) this.y = -20;
            }
            draw(ctx) {
                ctx.save(); ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation * Math.PI / 180);
                ctx.fillStyle = this.color; ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.vx = (Math.random() - 0.5) * 16;
                this.vy = (Math.random() - 0.5) * 16;
                this.life = 1;
                this.color = THEME_COLORS[Math.floor(Math.random() * THEME_COLORS.length)];
            }
            update() { this.x += this.vx; this.y += this.vy; this.life -= 0.03; }
            draw(ctx) {
                ctx.fillStyle = this.color; ctx.globalAlpha = Math.max(0, this.life);
                ctx.beginPath(); ctx.arc(this.x, this.y, 6, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1;
            }
        }

        class Game {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');

                this.bgImage = new Image();
                this.bgImage.src = 'bg.jpg';
                this.bgLoaded = false;
                this.bgImage.onload = () => { this.bgLoaded = true; };

                this.mode = 'name'; // 'name' או 'all'
                this.playerName = "NETA";
                this.letterSequence = ["N","E","T","A"];
                this.currentLetterIdx = 0;

                this.lives = 3;
                this.starsCollected = 0;
                this.isLevelComplete = false;
                this.isGrandVictory = false;

                this.pathProgress = 0;
                this.totalPathLength = 0;
                this.segments = [];
                this.pathOffset = { x: 0, y: 0 };

                this.targetTouch = null;
                this.playerSize = 45;
                this.pathRadius = 25;
                this.selectedCharacter = AVAILABLE_CHARACTERS[0];

                this.items = [];
                this.particles = [];
                this.confettiList = [];
                this.bgDecorations = [];
                this.magnetTime = 0;
                this.totalGameStars = 0;
                this.stats = loadStats();

                // פוליש חזותי בלבד — לא נוגע במכניקה
                this.hasDraggedOnce = false;
                this.missFlash = 0;
                this.startPulse = 60;
                this.confettiTimer = null;
                this.fireworkInterval = null;

                this.initBgDecorations();
                this.initControls();

                document.getElementById('next-level-btn').onclick = () => this.nextLevel();
                document.getElementById('replay-btn').onclick = () => {
                    document.getElementById('victory-screen').classList.add('hidden');
                    document.getElementById('start-screen').style.display = 'flex';
                };

                window.addEventListener('resize', () => this.resizeCanvas());
            }

            initBgDecorations() {
                this.bgDecorations = [];
                const decos = ['☁️', '🍬', '🎈', '✨'];
                for(let i=0; i<8; i++) {
                    this.bgDecorations.push({
                        x: Math.random() * window.innerWidth,
                        y: Math.random() * window.innerHeight,
                        icon: decos[Math.floor(Math.random() * decos.length)],
                        speed: 0.3 + Math.random() * 0.5,
                        size: 24 + Math.random() * 16
                    });
                }
            }

            resizeCanvas() {
                this.canvas.width = this.canvas.clientWidth || window.innerWidth;
                this.canvas.height = this.canvas.clientHeight || (window.innerHeight - 76);
                if (!this.isLevelComplete && this.totalPathLength > 0) {
                    this.startLevel();
                }
            }

            initControls() {
                const handleTouch = (e) => {
                    if (e.touches && e.touches.length > 1) {
                        this.targetTouch = null;
                        return;              // two fingers = let Safari pinch
                    }
                    e.preventDefault();
                    const rect = this.canvas.getBoundingClientRect();
                    const touch = e.touches ? e.touches[0] : e;
                    this.targetTouch = { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
                };
                this.canvas.addEventListener('touchstart', handleTouch, { passive: false });
                this.canvas.addEventListener('touchmove', handleTouch, { passive: false });
                this.canvas.addEventListener('mousedown', handleTouch);
                this.canvas.addEventListener('mousemove', (e) => { if (e.buttons === 1) handleTouch(e); });
                window.addEventListener('mouseup', () => this.targetTouch = null);
                window.addEventListener('touchend', () => this.targetTouch = null);
            }

            startLevel() {
                this.isLevelComplete = false;
                this.isGrandVictory = false;
                this.pathProgress = 0;
                this.targetTouch = null;
                this.magnetTime = 0;
                this.hasDraggedOnce = false;
                this.missFlash = 0;
                this.startPulse = 60;
                document.getElementById('modal').classList.add('hidden');
                document.getElementById('victory-screen').classList.add('hidden');

                this.items = [];
                this.particles = [];
                this.confettiList = [];

                const w = this.canvas.width;
                const h = this.canvas.height;

                // תחום יעד למסלול — לא ממלא את כל המסך, נשאר אוויר סביב האות
                const isMobile = window.innerWidth <= 600;
                const maxW = Math.min(w, isMobile ? (window.innerWidth - 40) : (window.innerWidth * 0.64));
                const maxH = Math.min(h, isMobile ? (window.innerHeight - 160) : (window.innerHeight - 150));
                this.pathOffset = { x: (w - maxW) / 2, y: (h - maxH) / 2 };

                const letterChar = this.letterSequence[this.currentLetterIdx] || 'A';
                const pointsDef = SHAPES[letterChar] || SHAPES['A'];

                this.segments = [];
                this.totalPathLength = 0;

                for (let i = 0; i < pointsDef.length - 1; i++) {
                    let p1 = { x: this.pathOffset.x + pointsDef[i].x * maxW, y: this.pathOffset.y + pointsDef[i].y * maxH };
                    let p2 = { x: this.pathOffset.x + pointsDef[i+1].x * maxW, y: this.pathOffset.y + pointsDef[i+1].y * maxH };
                    let dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
                    this.segments.push({ p1, p2, dist, accumLength: this.totalPathLength });
                    this.totalPathLength += dist;
                }

                this.totalSweetsNeeded = 5;

                for (let i = 1; i <= this.totalSweetsNeeded; i++) {
                    let targetLen = (i / this.totalSweetsNeeded) * this.totalPathLength;
                    let pos = this.getPointAtLength(targetLen);

                    let isMagnet = (i === 2);

                    this.items.push({
                        x: pos.x, y: pos.y, reqLength: targetLen,
                        size: i === this.totalSweetsNeeded ? 50 : 35,
                        type: i === this.totalSweetsNeeded ? 'chest' : (isMagnet ? 'magnet' : 'sweet'),
                        icon: i === this.totalSweetsNeeded ? '🎂' : (isMagnet ? '🧲' : SWEETS[i % SWEETS.length]),
                        collected: false
                    });
                }

                this.starsCollected = 0;
                this.updateUI(letterChar);
                this.showHint('גררו על הקו כדי לכתוב ' + letterChar);
            }

            showHint(text) {
                const chip = document.getElementById('hint-chip');
                if (!chip) return;
                chip.textContent = text;
                chip.classList.remove('hidden');
            }
            hideHint() {
                const chip = document.getElementById('hint-chip');
                if (chip) chip.classList.add('hidden');
            }

            getPointAtLength(len) {
                if (this.segments.length === 0) return {x: 50, y: 50};
                if (len <= 0) return this.segments[0].p1;
                if (len >= this.totalPathLength) return this.segments[this.segments.length-1].p2;

                for (let seg of this.segments) {
                    if (len >= seg.accumLength && len <= seg.accumLength + seg.dist) {
                        let ratio = seg.dist === 0 ? 0 : (len - seg.accumLength) / seg.dist;
                        return { x: seg.p1.x + (seg.p2.x - seg.p1.x) * ratio, y: seg.p1.y + (seg.p2.y - seg.p1.y) * ratio };
                    }
                }
                return this.segments[0].p1;
            }

            updateUI(letterStr) {
                document.getElementById('letter-display').innerText = letterStr;

                const livesEl = document.getElementById('lives-display');
                livesEl.innerHTML = '';
                for (let i = 0; i < 3; i++) {
                    livesEl.insertAdjacentHTML('beforeend', i < this.lives ? ICON_HEART_FULL : ICON_HEART_LOST);
                }

                document.getElementById('stars-display').innerText = this.starsCollected;
                document.getElementById('total-stars').innerText = this.totalSweetsNeeded;
                const pct = this.totalSweetsNeeded ? (this.starsCollected / this.totalSweetsNeeded) * 100 : 0;
                document.getElementById('progress-fill').style.width = pct + '%';
            }

            popCounter() {
                const el = document.getElementById('progress-count');
                if (!el) return;
                el.classList.remove('pop');
                void el.offsetWidth; // restart animation
                el.classList.add('pop');
            }

            handleInput() {
                if (this.isLevelComplete || !this.targetTouch) return;

                let bestLen = this.pathProgress;
                let minD = Infinity;

                let searchStart = Math.max(0, this.pathProgress - 40);
                let searchEnd = Math.min(this.totalPathLength, this.pathProgress + 60);

                for (let l = searchStart; l <= searchEnd; l += 5) {
                    let pt = this.getPointAtLength(l);
                    let d = Math.hypot(pt.x - this.targetTouch.x, pt.y - this.targetTouch.y);
                    if (d < minD) { minD = d; bestLen = l; }
                }

                if (minD < this.pathRadius * 3) {
                    this.pathProgress = bestLen;
                    if (!this.hasDraggedOnce) { this.hasDraggedOnce = true; this.hideHint(); }
                } else {
                    // משוב חזותי בלבד שהנגיעה לא על הקו — לא נוגע בחיים/ניקוד
                    this.missFlash = 14;
                }
            }

            createFireworks(x, y) {
                for (let i = 0; i < 30; i++) this.particles.push(new Particle(x, y));
            }

            checkCollisions() {
                if (this.isLevelComplete) return;

                let playerPos = this.getPointAtLength(this.pathProgress);

                this.items.forEach(item => {
                    if (item.collected) return;

                    if (this.magnetTime > 0 && item.type === 'sweet') {
                        let pullDist = Math.hypot(playerPos.x - item.x, playerPos.y - item.y);
                        if (pullDist < 120) {
                            item.x += (playerPos.x - item.x) * 0.15;
                            item.y += (playerPos.y - item.y) * 0.15;
                        }
                    }

                    const dist = Math.hypot(playerPos.x - item.x, playerPos.y - item.y);

                    if (item.type === 'chest' && this.starsCollected < this.totalSweetsNeeded - 1) {
                        return;
                    }

                    if (dist < (this.playerSize / 2 + item.size / 2 + 10) || (this.pathProgress >= item.reqLength && item.x === item.reqLength)) {
                        item.collected = true;
                        this.createFireworks(item.x, item.y);
                        hapticTick();

                        this.starsCollected++;
                        this.totalGameStars++;
                        const letterChar = this.letterSequence[this.currentLetterIdx];
                        this.updateUI(letterChar);
                        this.popCounter();

                        if (item.type === 'magnet') {
                            this.magnetTime = 300;
                            playCollectSound();
                        } else if (item.type === 'chest') {
                            playChestSound();
                            setTimeout(() => this.completeLevel(), 500);
                        } else {
                            playCollectSound();
                        }
                    }
                });
            }

            triggerGrandVictory() {
                this.isGrandVictory = true;
                const victoryLabel = this.mode === 'name' ? this.playerName : (this.mode === 'numbers' ? '0-9' : 'ABC');
                document.getElementById('victory-name-display').innerText = victoryLabel;
                document.getElementById('victory-screen').classList.remove('hidden');
                playVictorySound();

                if (this.totalGameStars > this.stats.bestStars) {
                    this.stats.bestStars = this.totalGameStars;
                    saveStats(this.stats);
                }

                for(let i=0; i<70; i++) {
                    this.confettiList.push(new Confetti(this.canvas.width, this.canvas.height));
                }

                // קונפטי וזיקוקים מוגבלים בזמן — לא לולאה אינסופית
                if (this.fireworkInterval) clearInterval(this.fireworkInterval);
                this.fireworkInterval = setInterval(() => {
                    if (!this.isGrandVictory) { clearInterval(this.fireworkInterval); return; }
                    this.createFireworks(Math.random() * this.canvas.width, Math.random() * this.canvas.height * 0.7);
                }, 400);

                if (this.confettiTimer) clearTimeout(this.confettiTimer);
                this.confettiTimer = setTimeout(() => {
                    this.confettiList = [];
                    if (this.fireworkInterval) { clearInterval(this.fireworkInterval); this.fireworkInterval = null; }
                }, 2500);
            }

            completeLevel() {
                this.isLevelComplete = true;
                this.currentLetterIdx++;

                if (this.currentLetterIdx < AVAILABLE_CHARACTERS.length) {
                    const newCharId = AVAILABLE_CHARACTERS[this.currentLetterIdx].id;
                    if (!this.stats.unlockedChars.includes(newCharId)) {
                        this.stats.unlockedChars.push(newCharId);
                        saveStats(this.stats);
                    }
                }

                if (this.currentLetterIdx >= this.letterSequence.length) {
                    this.triggerGrandVictory();
                    this.currentLetterIdx = 0;
                } else {
                    const modal = document.getElementById('modal');
                    document.getElementById('modal-title').innerText = "מעולה!";
                    document.getElementById('modal-text').innerText = "בוא נמשיך לאות הבאה!";
                    document.getElementById('next-level-btn').querySelector('span').innerText = "המשך";
                    modal.classList.remove('hidden');
                    this.renderCharacterSelection();
                }
            }

            renderCharacterSelection() {
                const charContainer = document.getElementById('characters-list');
                charContainer.innerHTML = '';
                AVAILABLE_CHARACTERS.forEach((char, index) => {
                    const isUnlocked = this.currentLetterIdx >= index || this.stats.unlockedChars.includes(char.id);
                    const div = document.createElement('div');
                    div.className = `char-card ${this.selectedCharacter.id === char.id ? 'selected' : ''}`;
                    div.style.opacity = isUnlocked ? '1' : '0.3';
                    div.innerText = char.emoji;
                    if (isUnlocked) {
                        div.onclick = () => { this.selectedCharacter = char; this.renderCharacterSelection(); };
                    }
                    charContainer.appendChild(div);
                });
            }

            nextLevel() { this.startLevel(); }

            drawBackgroundCover() {
                const img = this.bgImage, cw = this.canvas.width, ch = this.canvas.height;
                const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
                if (!iw || !ih) { this.ctx.drawImage(img, 0, 0, cw, ch); return; }
                const scale = Math.max(cw / iw, ch / ih);
                const sw = cw / scale, sh = ch / scale;
                const sx = (iw - sw) / 2, sy = (ih - sh) / 2;
                this.ctx.drawImage(img, sx, sy, sw, sh, 0, 0, cw, ch);
            }

            drawBackgroundDecorations() {
                this.bgDecorations.forEach(dec => {
                    dec.y -= dec.speed;
                    if (dec.y < -30) dec.y = this.canvas.height + 30;

                    this.ctx.font = `${dec.size}px Arial`;
                    this.ctx.textAlign = 'center';
                    this.ctx.globalAlpha = 0.4;
                    this.ctx.fillText(dec.icon, dec.x, dec.y);
                    this.ctx.globalAlpha = 1;
                });
            }

            drawStartEndMarkers() {
                if (this.segments.length === 0) return;
                const start = this.segments[0].p1;
                const end = this.segments[this.segments.length - 1].p2;

                // נקודת התחלה — עיגול מינטי עם פעימה קצרה בתחילת השלב
                const pulse = this.startPulse > 0 ? (this.startPulse / 60) : 0;
                this.ctx.save();
                if (pulse > 0) {
                    this.ctx.beginPath();
                    this.ctx.arc(start.x, start.y, 16 + (1 - pulse) * 14, 0, Math.PI * 2);
                    this.ctx.fillStyle = `rgba(126,221,181,${0.35 * pulse})`;
                    this.ctx.fill();
                }
                this.ctx.beginPath();
                this.ctx.arc(start.x, start.y, 9, 0, Math.PI * 2);
                this.ctx.fillStyle = '#7EDDB5';
                this.ctx.fill();
                this.ctx.restore();

                // נקודת סיום — כוכב קטן מתחת לפריט האחרון, לא מנעול
                this.ctx.save();
                this.ctx.translate(end.x, end.y);
                this.ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    const outerAngle = (Math.PI * 2 / 5) * i - Math.PI / 2;
                    const innerAngle = outerAngle + Math.PI / 5;
                    const ox = Math.cos(outerAngle) * 15, oy = Math.sin(outerAngle) * 15;
                    const ix = Math.cos(innerAngle) * 6, iy = Math.sin(innerAngle) * 6;
                    if (i === 0) this.ctx.moveTo(ox, oy); else this.ctx.lineTo(ox, oy);
                    this.ctx.lineTo(ix, iy);
                }
                this.ctx.closePath();
                this.ctx.fillStyle = 'rgba(255,214,90,.55)';
                this.ctx.fill();
                this.ctx.restore();
            }

            drawPath() {
                if (this.segments.length === 0) return;

                let shakeX = 0;
                if (this.missFlash > 0) {
                    shakeX = Math.sin(this.missFlash * 2) * 3;
                }

                this.ctx.save();
                this.ctx.translate(shakeX, 0);

                this.ctx.beginPath();
                this.ctx.moveTo(this.segments[0].p1.x, this.segments[0].p1.y);
                this.segments.forEach(seg => this.ctx.lineTo(seg.p2.x, seg.p2.y));
                this.ctx.lineCap = 'round'; this.ctx.lineJoin = 'round';
                // מתאר סגול (או אלמוגי רגע קצר אחרי החטאה), אחריו בסיס שמנת
                this.ctx.strokeStyle = this.missFlash > 0 ? '#FF7A73' : '#7758C8';
                this.ctx.lineWidth = 62;
                this.ctx.stroke();
                this.ctx.strokeStyle = '#FFFDF8'; this.ctx.lineWidth = 50; this.ctx.stroke();

                if (this.pathProgress > 0) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(this.segments[0].p1.x, this.segments[0].p1.y);
                    let drawnLen = 0;
                    for (let seg of this.segments) {
                        if (drawnLen + seg.dist <= this.pathProgress) {
                            this.ctx.lineTo(seg.p2.x, seg.p2.y);
                            drawnLen += seg.dist;
                        } else {
                            let ratio = seg.dist === 0 ? 0 : (this.pathProgress - drawnLen) / seg.dist;
                            this.ctx.lineTo(seg.p1.x + (seg.p2.x - seg.p1.x) * ratio, seg.p1.y + (seg.p2.y - seg.p1.y) * ratio);
                            break;
                        }
                    }
                    const grad = this.ctx.createLinearGradient(
                        this.segments[0].p1.x, this.segments[0].p1.y,
                        this.segments[this.segments.length-1].p2.x, this.segments[this.segments.length-1].p2.y
                    );
                    grad.addColorStop(0, '#4B8FEA');
                    grad.addColorStop(1, '#7758C8');
                    this.ctx.strokeStyle = grad; this.ctx.lineWidth = 50; this.ctx.stroke();
                }
                this.ctx.restore();
            }

            draw() {
                if (this.bgLoaded) {
                    this.drawBackgroundCover();
                    // שכבה שקופה עדינה כדי שהמסלול יישאר קריא — לא ורוד
                    this.ctx.fillStyle = "rgba(255,255,255,0.16)";
                    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                } else {
                    this.ctx.fillStyle = "#DDF3FF"; this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                }

                this.drawBackgroundDecorations();

                if (this.segments.length > 0) {
                    this.drawStartEndMarkers();
                    this.drawPath();
                }

                if (this.missFlash > 0) this.missFlash--;
                if (this.startPulse > 0) this.startPulse--;

                let playerPos = this.getPointAtLength(this.pathProgress);

                if (this.magnetTime > 0) {
                    this.magnetTime--;
                    this.ctx.beginPath();
                    this.ctx.arc(playerPos.x, playerPos.y, 120, 0, Math.PI * 2);
                    this.ctx.fillStyle = `rgba(75, 143, 234, ${Math.abs(Math.sin(this.magnetTime/10)) * 0.3})`;
                    this.ctx.fill();
                }

                this.items.forEach(item => {
                    if (item.collected) return;
                    this.ctx.font = `${item.size}px Arial`;
                    this.ctx.textAlign = 'center'; this.ctx.textBaseline = 'middle';

                    if (item.type === 'chest' && this.starsCollected < this.totalSweetsNeeded - 1) {
                        this.ctx.fillText('🔒', item.x, item.y);
                    } else {
                        this.ctx.fillText(item.icon, item.x, item.y);
                    }
                });

                this.confettiList.forEach(c => {
                    c.update(this.canvas.height);
                    c.draw(this.ctx);
                });

                for (let i = this.particles.length - 1; i >= 0; i--) {
                    this.particles[i].update(); this.particles[i].draw(this.ctx);
                    if (this.particles[i].life <= 0) this.particles.splice(i, 1);
                }

                this.ctx.font = `${this.playerSize}px Arial`;
                this.ctx.textAlign = 'center'; this.ctx.textBaseline = 'middle';
                this.ctx.fillText(this.selectedCharacter.emoji, playerPos.x, playerPos.y);
            }

            gameLoop = () => {
                this.handleInput();
                this.checkCollisions();
                this.draw();
                requestAnimationFrame(this.gameLoop);
            };
        }

        const runGame = () => {
            let selectedMode = 'name';
            const modeNameBtn = document.getElementById('mode-name-btn');
            const modeAllBtn = document.getElementById('mode-all-btn');
            const modeNumbersBtn = document.getElementById('mode-numbers-btn');
            const nameContainer = document.getElementById('name-input-container');
            const nameInput = document.getElementById('name-input');
            const nameHint = document.getElementById('name-hint');
            const startBtnEl = document.getElementById('start-btn');
            const bgMusic = document.getElementById('bg-music');
            const musicBtn = document.getElementById('music-btn');
            const homeBtn = document.getElementById('home-btn');
            const fontSelect = document.getElementById('font-select');

            homeBtn.innerHTML = ICON_HOME;
            musicBtn.innerHTML = ICON_SOUND_ON;

            fontSelect.onchange = (e) => {
                document.documentElement.style.setProperty('--game-font', e.target.value);
            };

            const stats = loadStats();
            document.getElementById('best-score-value').innerText = stats.bestStars;

            homeBtn.onclick = () => location.reload();

            let isMusicPlaying = false;

            const toggleMusic = () => {
                if (isMusicPlaying) {
                    bgMusic.pause();
                    musicBtn.innerHTML = ICON_SOUND_OFF;
                    musicBtn.setAttribute('aria-pressed', 'false');
                    isMusicPlaying = false;
                } else {
                    bgMusic.play().then(() => {
                        musicBtn.innerHTML = ICON_SOUND_ON;
                        musicBtn.setAttribute('aria-pressed', 'true');
                        isMusicPlaying = true;
                    }).catch(e => console.log("Music play error:", e));
                }
            };

            musicBtn.onclick = toggleMusic;

            const setActiveMode = (btn) => {
                [modeNameBtn, modeAllBtn, modeNumbersBtn].forEach(b => {
                    const on = b === btn;
                    b.classList.toggle('active', on);
                    b.setAttribute('aria-pressed', String(on));
                });
            };

            modeNameBtn.onclick = () => {
                selectedMode = 'name';
                setActiveMode(modeNameBtn);
                nameContainer.style.display = 'flex';
            };

            modeAllBtn.onclick = () => {
                selectedMode = 'all';
                setActiveMode(modeAllBtn);
                nameContainer.style.display = 'none';
            };

            modeNumbersBtn.onclick = () => {
                selectedMode = 'numbers';
                setActiveMode(modeNumbersBtn);
                nameContainer.style.display = 'none';
            };

            // רמז עדין כשהשדה ריק — לא חוסם התחלה, המשחק ימשיך עם NETA כמו קודם
            const syncNameHint = () => {
                const empty = selectedMode === 'name' && nameInput.value.trim().length === 0;
                nameHint.classList.toggle('hidden', !empty);
                startBtnEl.classList.toggle('is-empty', empty);
            };
            nameInput.addEventListener('input', syncNameHint);
            modeNameBtn.addEventListener('click', syncNameHint);
            modeAllBtn.addEventListener('click', syncNameHint);
            modeNumbersBtn.addEventListener('click', syncNameHint);
            syncNameHint();

            if (startBtnEl) {
                startBtnEl.onclick = () => {
                    if (!isMusicPlaying) toggleMusic();

                    let gameInstance = new Game();
                    gameInstance.mode = selectedMode;

                    if (selectedMode === 'name') {
                        let nameVal = nameInput.value.trim().toUpperCase().replace(/[^A-Z]/g, '');
                        if (nameVal.length === 0) nameVal = "NETA";
                        gameInstance.playerName = nameVal;
                        gameInstance.letterSequence = nameVal.split('');
                    } else if (selectedMode === 'numbers') {
                        gameInstance.letterSequence = Object.keys(NUMBERS);
                    } else {
                        gameInstance.letterSequence = Object.keys(ALPHABET);
                    }

                    document.getElementById('start-screen').style.display = 'none';

                    setTimeout(() => {
                        gameInstance.resizeCanvas();
                        gameInstance.startLevel();
                        gameInstance.gameLoop();
                    }, 100);
                };
            }
        };

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', runGame);
        } else {
            runGame();
        }
    })();
    </script>
</body>
</html>
